# Rinari built-in defaults.
# User values in ~/.rinari/config.toml override these.

user_name = ""
language = ""
model = ""
profile = "workspace"

[runtime.safeguards]
loop_detection = true
context_compaction = true

[runtime.emergency]
max_runtime_minutes = 120
max_model_calls = 500
max_tool_calls = 5000
max_subagent_calls = 100

[runtime.cost]
max_turn_cost = 0

[context]
compact_at_percent = 80
# Command output (stdout/stderr) above this reaches the model as head + tail;
# the complete output stays in an artifact the model reads with artifact.read.
artifact_output_threshold_kb = 16

[agents]
enabled = true
max_concurrent = 4
max_depth = 2
max_total = 12

[permissions]
profile = "workspace"

[network]
# auto: the permission profile decides (read free, sending asks per profile).
# ask: every host asks once. allow: no network prompts. off: no network.
mode = "auto"

[runtime.tools]
max_concurrency = 4
observation_bytes = 65536
round_observation_bytes = 262144
